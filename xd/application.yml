server:
  port: 8080

spring:
  main:
    web-application-type: servlet
    lazy-initialization: true   # la conexion al EMS (y su certificado) solo se crea al usarla; quitar cuando el certificado funcione
  # BD UAT de cops (la libreria cops-bd se autoconfigura: JPA + JDBC). Oracle, servicio HAMXCPOZU.
  datasource:
    # Conexion confirmada con SQL Developer (UAT_COPS): host MXCPO2U.oraas.dyn.nsroot.net, puerto 8889,
    # NOMBRE DE SERVICIO MXCPO2U (no SID), usuario RMXCOP4.
    # La contrasena va aqui por defecto (UAT). Si defines la variable de entorno DB_PASSWORD (STS: Run Configurations >
    # Environment), esa tiene prioridad. NO subas este archivo a Git con la contrasena.
    url: ${DB_URL:jdbc:oracle:thin:@//MXCPO2U.oraas.dyn.nsroot.net:8889/MXCPO2U}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${DB_USER:RMXCOP4}
    password: ${DB_PASSWORD:c4D6zdL8}       # la de UAT para RMXCOP4 (8 caracteres, sin coma); DB_PASSWORD la sobreescribe
    hikari:
      initialization-fail-timeout: -1       # no tumba el arranque si la BD no responde
      connection-timeout: 5000              # falla en 5 s (antes esperaba 30 s)
      minimum-idle: 0                       # no mantiene conexiones abiertas ni reintenta en segundo plano: con credenciales malas, cada reintento cuenta para bloquear la cuenta (ORA-28000)
      maximum-pool-size: 5
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect   # evita que Hibernate consulte la BD al arrancar para detectarlo
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
    hibernate:
      ddl-auto: none                        # la libreria no debe crear ni modificar tablas
    open-in-view: false
  application:
    name: chnn-cop-o-update-offer
  cloud:
    compatibility-verifier:
      enabled: false

# Requerido por el conector EMS
CONSUMER_APP: chnn-cop-o-update-offer

eureka:
  client:
    enabled: false

management:
  endpoint:
    shutdown:
      enabled: true
    metrics:
      enabled: true
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: '*'
  health:
    default:
      enabled: true

digital-engineering:
  exception:
    handler:
      global:
        enabled: 'true'
  logger:
    headers:
      enabled: 'true'

logging:
  pattern:
    level: '[%X{data}%thread] [%X{X-B3-TraceId:-}] - %5p'
  level:
    org.springframework.web: DEBUG
    com.banamex.cops: DEBUG
    com.tibco: DEBUG

# Usado por EmsSender (cola de envio y espera de respuesta) y por UpdateOfferMapper
update-offer:
  ems:
    queue: citi.gcg.la.cop_163621.mx_card.offer.update   # cola unica (resultado del concat de las globales de BW)
    timeout-seconds: 7                      # BW: RequestTimeout_Category1 = 7 (segundos) esperando la respuesta del JMS; 0 = no esperar respuesta
    dry-run: false                          # false = ENVIA al EMS (actualiza datos). true = solo escribe en el log lo que enviaria
    # Como viaja el evento en el mensaje JMS al EMS. BW: el Input del JMS Queue Requestor llena OtherProperties
    # (= propiedades del mensaje: _nm_, _ns_ y un campo por propiedad). Lo normal es mandar SOLO eso:
    # El Message Type del JMS Queue Requestor es XML Text, asi que va el XML en el cuerpo Y las propiedades:
    #   both       = propiedades + XML en el cuerpo  <- por defecto
    #   properties = solo propiedades del mensaje (cuerpo vacio)
    #   xml        = solo el XML en el cuerpo
    message-format: both
    event-namespace: www.tibco.com/be/ontology/OfferEngine/Events/UpdateOffer   # BW: _ns_ (solo va en las propiedades)
    time-to-live-ms: 30                     # BW: JMSExpiration = 30, en MILISEGUNDOS (confirmado). 0 = sin expiracion. Si el EMS no alcanza a recibir los mensajes, subirlo
    body-element: UpdateOffer               # BW: _nm_ (nombre del elemento del cuerpo)
    envelope: false                         # false = solo <UpdateOffer>... (por defecto) | true = <Envelope><Body><UpdateOffer>...
    xml-namespace: false                    # true = <UpdateOffer xmlns="www.tibco.com/be/..."> (namespace del evento, sin prefijo)
  # Valores del RqHeader que no vienen en los headers HTTP (uuid, ChannelId y countryCode si vienen de HTTP)
  # Globales de BW COP/Padding (CustomerNO en el JMS Queue Requestor)
  jms-requestor:
    customer-padding: false                 # COP/Padding/CustomerPadding = false (no se rellena CustomerNO)
    customer-padding-length: 19             # COP/Padding/CustomerNo = 19 (longitud de tib:pad-front; solo aplica si customer-padding = true)
    customer-padding-char: "0"              # COP/Padding/PadCharacter
  # BW: $_globalVariables/ns6:GlobalVariables/COP/AbInitioTest (hoy = N). Con Y, BW usa el camino de AbInitio
  # (casos 3A y 3B del mapper). Ese camino aun no esta migrado: con Y el micro avisa en el log y sigue por el JMS.
  ab-initio-test: "N"
  # Respuesta que arma el micro por oferta (el End de BW). Marcadores: {dateTime} {step} {detail}
  response:
    source: micro                           # micro = la arma el micro con la fecha | ems = lo que contesto el EMS (como el End de BW)
    success-code: COP_UPDOF_0
    success-text: "Successfully update offer {dateTime}"
    error-code: ERROR
    error-text: "Error update offer {dateTime}. Falló en {step}: {detail}"
    date-format: "yyyy/MM/dd HH:mm:ss"      # YYYY/MM/DD HH24:MI:SS, en la zona ecrm-time-zone
    # OfferStatus = "U": respuesta como el Map-Data de BW (caso 2), sin fecha. Poner false para tratarlas como las demas
    status-u-bw-format: true
    status-u-success-code: COP_UPDOF_0
    status-u-success-text: "Successfully update offer {offerKey}"          # {offerKey} = off:mx:campana_ola_cliente[_cuenta][_tarjeta]
    status-u-campaign-missing-code: COP_UPDOF_432
    status-u-campaign-missing-text: "Campaign cmp: {campaignId} is not present cannot proceed with the Update Offer"
    # Log "[KAFKA] Resultado": si el evento se envio o no
    kafka-success-text: "Successfully send offer to Kafka {dateTime}"
    kafka-disabled-text: "Kafka desactivado (offer.kafka.enabled = false): no se envió nada {dateTime}"
    kafka-dry-run-text: "Kafka en dry-run: el mensaje no se publicó {dateTime}"
    kafka-error-text: "Error send offer to Kafka {dateTime}. Falló en {step}: {detail}"
  # TimeZoneMapRequest
  timezone:
    translate-time-zone: true               # BW: COP/TimeZone/TranslateTimeZone (en las globales esta en false; aqui true por indicacion del equipo, cambiar por ambiente)
    # Start/System = header ChannelId (GetContext/ChannelID): ya no es un valor fijo en el yml
    sys-mode: RealTime                      # Start/SysMode
    invalid-code: COP_TZCOD_115             # ResponseCode de la validacion de zona horaria (indicado por el equipo)
    be-time-format: "HH:mm:ss"              # BW: BETimeFormat
    be-date-time-format: "yyyy-MM-dd HH:mm:ss"        # BW: BEDateTimeFormat
    ecrm-time-zone: US/Central              # BW: ECRMTimeZone
    time-zone-date-time-format: "yyyy-MM-dd'T'HH:mm:ssZ"
  # LogRequestService / LoggingProperties
  logging:
    audit-points-enabled: "1001"
    application-name: COPS
    application-csi-id: "163621"
    component-name: UpdateOffer

# AuditLogService: log del request (headers + JSON recibido) y de la respuesta (JSON que devuelve el micro)
audit:
  points-enabled: "1001"                    # BW: AuditPointsEnabled = 1001. Posicion 1 = log del request; posicion 4 = log de la respuesta

# PerformSuppressionCheck (COP/Suppression/CheckForSuppression)
cop:
  suppression:
    check-for-suppression: "N"
    # Lista de entidades suprimidas: se carga de COP_SUPP_CHNL y COP_SUPP_OPR (BW: /BW/StartUp/startUpSuppression)
    query-timeout-seconds: 30     # BW: COP/QueryRecords/TimeoutDefault (valor por confirmar)
    max-rows: 0                   # BW: COP/Connections/BSDB/MaxConns (valor por confirmar); 0 = sin limite

# ==========================================================
# LIBRERIA MAFIM EMS (prefijo: digital-integration.messaging.jms)
# ==========================================================
digital-integration:
  messaging:
    jms:
      # broker-config no es de la libreria: solo agrupa valores para reusarlos con ${...}
      broker-config:
        username: "rmx_uat_usr"
        password: "rmxusr"
        sessionCacheSize: 10
        receiveTimeout: 30000
        ssl:
          # Certificado de UAT (formato PKCS12 = .p12)
          identity: "C:/Users/AS82906/certs/rmx_uat_usr.ca1.cert.p12"
          identityEncoding: "PKCS12"
          password: "rmxusr"
          debugTrace: false
          trace: false
          vendor: "j2se"
          # Solo para pruebas: desactivan la validacion del host del servidor
          enableVerifyHost: false
          enableVerifyHostName: false

      platforms:
        - platformId: "banamex-cops"
          enabled: true
          primary: 1
          contingency: 0
          connections:
            - id: "ems-update-offer-1"
              datacenter: 10
              readyToServe: true
              name: "EmsConnectionUpdateOffer"
              # Debe coincidir con el @Bean y el @Qualifier de JmsConfig / EmsSender
              jmsTemplateName: "updateOfferJmsTemplate"
              brokerUrl: "ssl://mwlgc-tibla18u.lac.nsroot.net:45143"
              username: ${digital-integration.messaging.jms.broker-config.username}
              password: ${digital-integration.messaging.jms.broker-config.password}
              sessionCacheSize: ${digital-integration.messaging.jms.broker-config.sessionCacheSize}
              receiveTimeout: ${digital-integration.messaging.jms.broker-config.receiveTimeout}
              # Intentos de conexion / reconexion (la libreria hace unboxing: si faltan -> NullPointerException)
              connAttemptCount: 3
              connAttemptDelay: 1000
              connAttemptTimeout: 5000
              reconnAttemptCount: 3
              reconnAttemptDelay: 1000
              reconnAttemptTimeout: 5000
              ssl:
                identity: ${digital-integration.messaging.jms.broker-config.ssl.identity}
                identityEncoding: ${digital-integration.messaging.jms.broker-config.ssl.identityEncoding}
                password: ${digital-integration.messaging.jms.broker-config.ssl.password}
                debugTrace: ${digital-integration.messaging.jms.broker-config.ssl.debugTrace}
                trace: ${digital-integration.messaging.jms.broker-config.ssl.trace}
                vendor: ${digital-integration.messaging.jms.broker-config.ssl.vendor}
                enableVerifyHost: ${digital-integration.messaging.jms.broker-config.ssl.enableVerifyHost}
                enableVerifyHostName: ${digital-integration.messaging.jms.broker-config.ssl.enableVerifyHostName}

      # queues-config es una lista aparte de platforms (campo queuesConfig de JmsProperties)
      queues-config:
        - platformId: "banamex-cops"
          post:
            - csi: 10
              queues:
                - channel: update-offer
                  queue:
                    # queue es una lista: cada elemento lleva guion
                    - send: ${update-offer.ems.queue}
                - channel: kafka
                  queue:
                    - send: ${offer.kafka.queue}

    security:
      allowed-ip-addresses: "0:0:0:0:0:0:0:1,10.0.0.0/8,127.0.0.1"
      path-secured: /api/private/v1/information-technologies/ems/messages/connector/**
      actuator-path: /actuator/**

# ==========================================================
# FulFillKafkaSender: envio de la oferta actualizada a Kafka (via bridge JMS)
# ==========================================================
offer:
  kafka:
    enabled: true                   # BW: isKafkaOn_1 = true. Con mode: dry-run solo escribe el JSON en el log
    mode: jms                   # dry-run (solo log) | jms (cola del bridge) | kafka (directo, requiere spring-kafka)
    delay-ms: 200                   # BW: COP/Kafka/EHKafkaUpdate_Delay
    queue: citi.gcg.la.cop_163621.MX_dm.raw.cops-offer-fulfillment-req   # cola unica (BW: KafkaMsgSender); mode=jms
    message-format: json            # json = el JSON del evento tal cual, todo junto | envelope = <root><RefId/><jsonString/></root>
    # mode=kafka: el topico debe empezar con "lac." (el replicator de DR solo copia lac.*) y se da de alta
    # con la plataforma (tarjeta Jira MIATR); requiere FID/keytab/certificado y perfil de seguridad (mTLS o SASL).
    topic: CAMBIAR_TOPICO
    offer-prefix: "off:mx:"
    wave-prefix: "wvch:"
    key-separator: ":"              # CONFIRMAR contra el XPath de DataFetch
    omit-nulls: true                # CONFIRMAR formato de Render JSON
    mask-card-number: false         # true = solo ultimos 4 digitos en el mensaje (acordar con seguridad)
    max-attempts: 3
    retry-backoff-ms: 500
    time-to-live-ms: ${update-offer.ems.time-to-live-ms:0}   # misma configuracion que el JMS del EMS (KafkaMsgSender)
    producer-csi: "163621"
    event-name: Updateofferrequest   # constante de header/name en KafkaSenderDashboard (BW)
    event-version: "1.0"
    country-code: MX
    business-code: DM
    executor-core-size: 2
    executor-max-size: 4
    executor-queue-capacity: 100
