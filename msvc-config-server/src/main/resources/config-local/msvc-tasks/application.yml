server:
  port: 8082

spring:
  application:
    name: msvc-tasks
  datasource:
    url: jdbc:mysql://localhost:3306/task_db
    username: root
    password: admin
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka   # ← Apunta al Eureka Server